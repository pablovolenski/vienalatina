{% extends "base.html" %}
{% block title %}{{ t('cuenta.entrar') }}{% endblock %}

{% block main %}
<form class="card card--center" method="post" action="{{ url_for('auth.login') }}">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
	<input type="hidden" name="next" value="{{ next }}">
	<h1>{{ t('cuenta.entrar_titulo') }}</h1>
	<p class="muted">{{ t('cuenta.entrar_nota', sitio=site_name) }}</p>

	<label for="identifier">{{ t('cuenta.identificador') }}</label>
	<input id="identifier" name="identifier" required autocomplete="username"
	       autocapitalize="none" autofocus>

	<label for="password">{{ t('cuenta.contrasena') }}</label>
	<input id="password" name="password" type="password" required
	       autocomplete="current-password">

	<div class="actions">
		<button class="btn" type="submit">{{ t('cuenta.entrar') }}</button>
	</div>

	<p class="muted small">
		<a href="{{ url_for('auth.recover') }}">{{ t('cuenta.olvidada') }}</a>
	</p>
	<p class="muted small">{{ t('cuenta.sin_cuenta') }}</p>
</form>
{% endblock %}

{# A page on the PUBLIC site, so it does not extend base.html — that is the
   members-area chrome, with its navigation and its "Área privada" footer.

   Its styling lives in static/profile.css and NOT in a <style> block here.
   The Content-Security-Policy has no 'unsafe-inline', so an inline block is
   ignored by the browser without a word, and the page arrives looking like
   1996. test_templates.py fails the build if one reappears. #}
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ member.display_name }} — Viena Latina</title>
	<meta name="description" content="{{ (member.bio or '')[:150] }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
<div class="wrap">
	<a class="home" href="/">← Viena Latina</a>

	<div class="head">
		{% if photo %}<img class="photo" src="{{ photo }}" alt="{{ member.display_name }}">{% endif %}
		<h1>{{ member.display_name }}</h1>
	</div>

	{% if member.bio %}<div class="bio">{{ bio_html }}</div>{% endif %}

	{% if links %}
	<ul class="links">
		{# nofollow + noopener: these are addresses somebody typed into a form,
		   and the page they point at should gain neither our ranking nor a
		   handle on the window it was opened from. #}
		{% for link in links %}
		<li><a href="{{ link.url }}" rel="nofollow noopener">{{ link.label }}</a></li>
		{% endfor %}
	</ul>
	{% endif %}

	<footer>Miembro de <a href="/">Viena Latina</a>.</footer>
</div>
</body>
</html>

# El muro: el tablón interno, los temas y las respuestas.
#
# Plurals are two keys rather than one with a rule. Spanish, German and
# Portuguese all have exactly two forms, and two keys is something an admin can
# read and fix; a rule is something only a programmer can.

muro.escribir:
  es: "Escribir"
  _note: "El botón de arriba del muro, para empezar un tema."

muro.vacio:
  es: "Todavía no hay nada en el muro. Escribe el primero."
  _note: "Cuando el muro no tiene ningún tema."

muro.cerrado:
  es: "Cerrado"
  _note: "La etiqueta de un tema al que ya no se puede responder."

muro.respuesta:
  es: "{n} respuesta"
  _note: "Debajo de un tema que tiene exactamente una."

muro.respuestas:
  es: "{n} respuestas"
  _note: "Debajo de un tema que tiene ninguna o más de una."

# «Fijar» y «No fijar» están en comun.yaml: es el mismo gesto en el muro y en
# lo ya publicado, y cambiarlo en un sitio y no en el otro sería un descuido.

muro.cerrar:
  es: "Cerrar"
  _note: "Cierra el tema a nuevas respuestas. Sólo administración."

muro.reabrir:
  es: "Reabrir"
  _note: "El mismo botón cuando el tema ya está cerrado."

muro.confirmar_eliminar:
  es: "¿Eliminar este tema?"
  _note: "La pregunta antes de borrar un tema."

muro.tema_cerrado:
  es: "Este tema está cerrado a nuevas respuestas."
  _note: "En lugar de la caja de responder, cuando el tema está cerrado."

muro.responder:
  es: "Responder"
  _note: "El nombre de la caja de respuesta, al final de un tema."

muro.publicar_respuesta:
  es: "Publicar respuesta"
  _note: "El botón debajo de esa caja."

muro.nuevo_tema:
  es: "Nuevo tema"
  _note: "El título de la página al escribir algo nuevo en el muro."

muro.editar_tema:
  es: "Editar tema"
  _note: "El mismo título al corregir un tema que ya existe."

muro.editar_respuesta:
  es: "Editar respuesta"
  _note: "El título de la pantalla al corregir una respuesta ya publicada."

muro.mensaje:
  es: "Mensaje"
  _note: "El nombre del campo grande donde se escribe el tema."

muro.aviso_mensaje_vacio:
  es: "El mensaje no puede estar vacío."
  _note: "Al publicar un tema sin texto."

muro.aviso_comentario_vacio:
  es: "El comentario no puede estar vacío."
  _note: "Al responder sin escribir nada."

muro.aviso_espera_tema:
  es: "Espera {n} segundos antes de publicar otra vez."
  _note: >-
    Al publicar dos temas seguidos muy rápido. No es un castigo: evita que un
    descuido —o un botón pulsado dos veces— llene el muro.

muro.aviso_espera_comentario:
  es: "Espera {n} segundos antes de comentar otra vez."
  _note: "Lo mismo al responder."

muro.aviso_tema_eliminado:
  es: "Tema eliminado."
  _note: "Al borrar un tema."

muro.aviso_comentario_eliminado:
  es: "Comentario eliminado."
  _note: "Al borrar una respuesta."

muro.aviso_tema_cerrado:
  es: "Este tema está cerrado."
  _note: "Al intentar responder a un tema que la administración ha cerrado."

muro.error_campo_desconocido:
  es: "Campo desconocido."
  _note: >-
    Casi nadie lo verá: sale cuando un formulario llega con algo que no se
    esperaba, normalmente porque la página estuvo abierta durante un cambio.

muro.error_sin_identificador:
  es: "Falta el identificador."
  _note: "Lo mismo cuando falta el número de lo que se iba a marcar."

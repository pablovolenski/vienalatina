# The words the public site says for itself — everything that is not an article
# somebody wrote. Three languages each, because vienalatina.com is built in
# three and a label left in Spanish on the German pages is the one kind of
# mistake nobody reports.
#
# These are the `site.*` namespace, and the prefix is load-bearing: it is what
# tells the screen to draw three boxes instead of one, and what sends the value
# to `data/ui.yaml` and the pipeline rather than only to SQLite.
#
# The theme keeps its own copy of these defaults in
# themes/vienalatina/layouts/partials/t.html, because Hugo reads the repository
# and the members area reads its own image — neither can read the other's file.
# A test holds the two together, the way the two `:root` blocks are held to
# brand.py's FACTORY.
#
# A language left empty is filled by the pipeline's translation engine on the
# next build. That is a fallback and not the plan: a one-word label is the worst
# case for machine translation, and the three boxes are there to be used.


# The words that appear on screen after screen.
#
# «Guardar» is on nine forms, «Cancelar» on seven, «(opcional)» on fourteen
# labels. One key each, so renaming one renames all of them — which is both the
# point and most of the reason 506 occurrences in the templates are only ~360
# distinct strings.
#
# A word belongs here when changing it in one place and not the others would be
# a bug. Anything a single screen says stays in that screen's own file.

comun.guardar:
  es: "Guardar"
  _note: "El botón de cualquier formulario que edita algo que ya existe."

comun.publicar:
  es: "Publicar"
  _note: "El mismo botón cuando lo que se está escribiendo es nuevo."

comun.cancelar:
  es: "Cancelar"
  _note: "Junto a Guardar, en todos los formularios."

comun.editar:
  es: "Editar"
  _note: "En temas, respuestas, artículos y páginas."

comun.eliminar:
  es: "Eliminar"
  _note: "En temas, respuestas, artículos, páginas e imágenes."

comun.opcional:
  es: "(opcional)"
  _note: "Detrás del nombre de un campo que se puede dejar vacío. Sale catorce veces."

comun.volver:
  es: "Volver"
  _note: "El enlace de arriba de una página que se abrió desde una lista."

comun.fijar:
  es: "Fijar"
  _note: >-
    Pone algo arriba del todo, en el muro y en el sitio público. Lo ven
    moderadores y administración.

comun.no_fijar:
  es: "No fijar"
  _note: "El mismo botón cuando ya está fijado."

comun.titulo:
  es: "Título"
  _note: "El campo del título, en todos los formularios que tienen uno."

comun.resumen:
  es: "Resumen"
  _note: "El campo de la frase que se ve en los listados y al compartir el enlace."

comun.fecha:
  es: "Fecha"
  _note: "La columna y el campo de la fecha de publicación."

comun.evento:
  es: "Evento"
  _note: "La columna de la fecha del evento, en la lista de lo publicado."

comun.imagen:
  es: "Imagen"
  _note: "El campo para adjuntar una sola foto."

comun.si_evento:
  es: "Si es un evento"
  _note: "El desplegable de los dos formularios de publicación, cerrado."

comun.si_evento_campos:
  es: "(fecha, hora, lugar)"
  _note: "Lo que sale en gris detrás de esa frase."

comun.evento_fecha:
  es: "Fecha del evento"
  _note: "El día en que es el evento, que no es el día en que se publica."

comun.evento_hora:
  es: "Hora"
  _note: "La hora del evento."

comun.evento_hora_nota:
  es: "Déjala vacía si dura todo el día."
  _note: "Debajo del campo de la hora."

comun.evento_lugar:
  es: "Lugar"
  _note: "Dónde es el evento."

comun.evento_lugar_nota:
  es: "Dónde es: el sitio, la calle, el barrio."
  _note: "Debajo del campo del lugar."

comun.imagenes:
  es: "Imágenes"
  _note: "El campo para adjuntar fotos."

comun.markdown:
  es: "Se puede usar Markdown: **negrita**, listas, enlaces."
  _note: "La pista dentro de las cajas de escribir, cuando están vacías."

comun.markdown_largo:
  es: "Se puede usar Markdown: **negrita**, ## títulos, listas, enlaces."
  _note: >-
    La misma pista en las cajas grandes, las de un texto que va al sitio
    público: ahí los títulos sí tienen sentido.

comun.ia:
  es: "Generado con IA"
  _note: "La etiqueta de un texto marcado como escrito por una máquina."

# Dos claves y no una: la etiqueta va en lo ya publicado y el interruptor en el
# formulario, y cambiar una sin la otra no sería un error. El sitio público las
# distingue igual, con «ai» y «aifull».
comun.ia_campo:
  es: "Contenido generado con IA"
  _note: "El interruptor junto al botón de publicar, donde se marca."

comun.ia_ayuda:
  es: "Quien lo publicó marcó este texto como generado con inteligencia artificial."
  _note: "Lo que sale al posar el ratón sobre esa etiqueta."

comun.fijado:
  es: "Fijado"
  _note: "La etiqueta de algo puesto arriba a propósito."

comun.tu:
  es: "(tú)"
  _note: "Detrás de tu propio nombre, en el directorio y en tu ficha."

comun.editado:
  es: "(editado)"
  _note: "Detrás de la fecha, cuando alguien ha cambiado lo que escribió."

comun.anteriores:
  es: "← Anteriores"
  _note: "Para ir a la página anterior de una lista larga."

comun.siguientes:
  es: "Siguientes →"
  _note: "Para ir a la siguiente."

comun.volver_inicio:
  es: "Volver a Inicio"
  _note: "El botón de las páginas de error."

comun.me_gusta:
  es: "Me gusta"
  _note: >-
    No se ve: es lo que lee un lector de pantalla en el botón del pulgar. El
    dibujo no dice nada por sí solo.

comun.quitar_me_gusta:
  es: "Quitar mi me gusta"
  _note: "Lo mismo cuando ya lo has pulsado."

comun.volver_gestion:
  es: "Volver a {seccion}"
  _note: >-
    Arriba a la derecha en las seis pantallas de administración. El nombre de la
    sección llega puesto, así que si Gestión se llama de otra manera este enlace
    lo dice solo.

comun.pendiente_publicar:
  es: "Pendiente de publicar"
  _note: >-
    El título del aviso de Marca, Identidad y Textos cuando algo se guardó aquí
    pero no llegó al sitio público.

comun.reintentar_publicar:
  es: "Reintentar publicar"
  _note: "El botón de ese aviso, que lo vuelve a intentar."

# --- las imágenes que no entran --------------------------------------------
#
# Estos tres salen al adjuntar fotos y valen para el muro, los privados, el
# perfil y las propuestas: una sola redacción para todos los sitios donde se
# sube una imagen.

comun.subida_demasiadas:
  es: "Como máximo {maximo} imágenes por mensaje."
  _note: "Al adjuntar más fotos de las que se admiten de una vez."

comun.subida_pesa:
  es: "«{archivo}» pesa {peso}KB y el máximo es {maximo}KB."
  _note: "Al adjuntar una foto demasiado grande."

comun.subida_no_imagen:
  es: "«{archivo}» no parece una imagen. Se aceptan {tipos}."
  _note: >-
    Al adjuntar algo que no es una foto. Se mira lo que el archivo es por
    dentro, no cómo se llama.

comun.error_evento_fecha:
  es: "La fecha del evento debe tener el formato AAAA-MM-DD."
  _note: >-
    Los dos formularios que publican —el del moderador y el del miembro— leen
    los campos del evento con la misma función, así que comparten este aviso.

comun.error_evento_hora:
  es: "La hora debe ser HH:MM, de 00:00 a 23:59."
  _note: "Lo mismo para la hora del evento."

# --- las dos mitades del sitio ---------------------------------------------
#
# Marca, Identidad y Textos guardan en dos sitios: aquí primero, que vale ya, y
# el sitio público después, que tarda un par de minutos. Los tres dicen lo
# mismo al terminar, así que lo dicen con las mismas tres claves.

comun.aviso_guardado_publicado:
  es: "Guardado. El sitio público se reconstruye en un par de minutos."
  _note: "Al guardar en Marca, Identidad o Textos y llegar también al sitio público."

comun.aviso_publicado:
  es: "Publicado. El sitio público se reconstruye en un par de minutos."
  _note: "Al reintentar la publicación desde el aviso de «Pendiente de publicar»."

comun.aviso_guardado_sin_publicar:
  es: "Guardado aquí. El sitio público no se ha actualizado: {error}"
  _note: >-
    Cuando lo de aquí se guardó pero no se pudo contactar con el servidor de
    git. Lo guardado no se pierde: queda pendiente de publicar.

comun.error_fecha:
  es: "La fecha debe tener el formato AAAA-MM-DD."
  _note: >-
    Una fecha que no se entiende, en el editor del sitio y en el calendario
    interno: los dos campos se llaman «Fecha» y dicen lo mismo.

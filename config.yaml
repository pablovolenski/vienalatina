# Viena Latina — Hugo site configuration
# Three languages: Spanish (default, at /), German (/de/), Brazilian Portuguese (/pt-br/).
# Siblings pair by filename basename: mi-articulo.es.md ↔ mi-articulo.de.md ↔ mi-articulo.pt-br.md

baseURL: "https://vienalatina.com/"
title: "Viena Latina"
theme: "vienalatina"

defaultContentLanguage: "es"
defaultContentLanguageInSubdir: false

# Date-scoped so two posts can share a title without fighting over one URL.
# `:slug` falls back to the title when front matter sets none, so a bare
# "/:slug/" mapped every post called "Hola mundo" onto /hola-mundo/; Hugo wrote
# both documents into that one index.html and the page rendered as two stacked
# copies of the site, with no error anywhere. Community blogs repeat titles
# constantly ("Resumen del mes"), so the date carries the uniqueness. The day is
# part of it because the two posts that exposed this were eleven days apart in
# the same month; only same-title-same-day now collides, and the build guard in
# .woodpecker.yml fails that loudly instead of shipping it.
permalinks:
  post: "/:year/:month/:day/:slug/"

# No taxonomies. An empty map rather than no `taxonomies` key at all: leaving
# the key out restores Hugo's own defaults, which are `tags` and `categories` —
# so deleting the block built the very pages it was meant to remove. This turns
# them off, and /categories/… and /tags/ fall through to the site's 404.
taxonomies: {}

languages:
  es:
    languageCode: "es"
    languageName: "Español"
    weight: 1
    params:
      description: "Comunidad latinoamericana en Viena — turismo, cultura, gastronomía, comunidad y comercio."
    # Only Inicio lives here. Everything after it is built from the pages
    # themselves by partials/header.html — so a page published from the members
    # area appears on the site, with its own translated title, instead of
    # needing three edits in this file. Weight decides the side: under 5 goes
    # before the pages, 5 or more after them.
    #
    # Comunidad used to be the entry at weight 9. It is a button in the header
    # bar now rather than a word in the menu, so its three translations live in
    # partials/t.html — the URL is the same in every language, and a menu entry
    # was only ever carrying the label.
    menus:
      main:
        - name: "Inicio"
          url: "/"
          weight: 1
  de:
    languageCode: "de"
    languageName: "Deutsch"
    weight: 2
    params:
      description: "Lateinamerikanische Community in Wien — Tourismus, Kultur, Gastronomie, Gemeinschaft und Handel."
    menus:
      main:
        - name: "Start"
          url: "/de/"
          weight: 1
  pt-br:
    languageCode: "pt-BR"
    languageName: "Português (Brasil)"
    weight: 3
    params:
      description: "Comunidade latino-americana em Viena — turismo, cultura, gastronomia, comunidade e comércio."
    menus:
      main:
        - name: "Início"
          url: "/pt-br/"
          weight: 1

params:
  # The picture a share card falls back on when a post or page has none, and the
  # organisation's logo in the structured data.
  #
  # **The logo uploaded in Gestión → Marca is used first**, so this is now only
  # for a site that wants a different share picture from its logo — a photo of
  # the city, say. One path (/uploads/algo.png) and WhatsApp, Signal, Mastodon
  # and Bluesky all start showing an image. Empty, with no logo either, means a
  # link shares as title and description.
  defaultImage: ""

  # The organisation's profiles elsewhere, for `sameAs` in the Organization
  # schema: it is how a search or answer engine knows the Instagram account and
  # this site are the same body. One URL per line when they exist.
  sameAs: []

  # og:locale values per language slug (ported from theme/inc/seo.php).
  localeMap:
    es: "es_ES"
    de: "de_DE"
    pt-br: "pt_BR"

# llms.txt — custom plain-text output rendered from layouts/index.llms.txt
# (ported from theme/inc/robots-and-llms.php).
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
  # One .ics beside an event's page, so "añadir a mi calendario" is a link and
  # not an instruction. Only pages whose frontmatter lists this output generate
  # one, and the editor writes that line for a post in the Evento category —
  # see apps/board/content.py.
  ics:
    mediaType: "text/calendar"
    baseName: "index"
    isPlainText: true

outputs:
  home: ["HTML", "RSS", "llms"]

sitemap:
  changefreq: "weekly"
  priority: 0.5

markup:
  goldmark:
    renderer:
      # Raw HTML in a post is not rendered as HTML. It was on, for content
      # migrated from WordPress that carried inline markup; that content is
      # gone — no file under content/ holds a single tag — and leaving it on
      # had a cost that grew with the members area: a proposal written by a
      # member is rendered here with `html=False`, so a moderator reviewing
      # `<img src=x onerror=…>` sees the characters and approves them, and
      # this flag is what would have run them on the live site.
      #
      # hardWraps is deliberately left off: the files are hard-wrapped at
      # about 78 characters, so turning it on would break every sentence in
      # half. apps/board/render.py says how the two renderers are kept
      # honest about that.
      unsafe: false

enableRobotsTXT: false   # robots.txt is a static file in static/
